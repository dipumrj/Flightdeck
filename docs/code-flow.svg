<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
    <style>
      .box { fill:#fff; stroke:#333; stroke-width:1.5; rx:6; }
      .title { font: 14px sans-serif; fill:#111; }
      .small { font: 12px sans-serif; fill:#222; }
      .node-fill-tests { fill:#f9f; }
      .node-fill-fixture { fill:#ff9; }
      .node-fill-page { fill:#9f9; }
      .node-fill-loc { fill:#9ff; }
      .node-fill-helpers { fill:#fc9; }
      .node-fill-users { fill:#cfc; }
      .node-fill-reports { fill:#eee; }
      .node-fill-env { fill:#ffd; }
      .node-fill-pwconf { fill:#dfd; }
      .dashed { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <!-- Nodes -->
  <g id="tests">
    <rect x="60" y="40" width="220" height="50" class="box node-fill-tests" />
    <text x="170" y="70" text-anchor="middle" class="title">tests/login.spec.ts</text>
  </g>

  <g id="fixture">
    <rect x="340" y="40" width="220" height="50" class="box node-fill-fixture" />
    <text x="450" y="70" text-anchor="middle" class="title">fixtures/test.fixture.ts</text>
  </g>

  <g id="loginpage">
    <rect x="620" y="40" width="260" height="60" class="box node-fill-page" />
    <text x="750" y="60" text-anchor="middle" class="title">pages/login.page.ts</text>
    <text x="750" y="80" text-anchor="middle" class="small">(LoginPage extends BasePage)</text>
  </g>

  <g id="basepage">
    <rect x="620" y="130" width="220" height="50" class="box" />
    <text x="730" y="160" text-anchor="middle" class="title">pages/base.page.ts</text>
  </g>

  <g id="locators">
    <rect x="620" y="220" width="220" height="50" class="box node-fill-loc" />
    <text x="730" y="250" text-anchor="middle" class="title">locators/login.locators.ts</text>
  </g>

  <g id="helpers">
    <rect x="340" y="220" width="220" height="50" class="box node-fill-helpers" />
    <text x="450" y="250" text-anchor="middle" class="title">utils/helpers.ts</text>
  </g>

  <g id="users">
    <rect x="60" y="220" width="220" height="50" class="box node-fill-users" />
    <text x="170" y="250" text-anchor="middle" class="title">test-data/users.json</text>
  </g>

  <g id="environment">
    <rect x="60" y="320" width="220" height="50" class="box node-fill-env" />
    <text x="170" y="350" text-anchor="middle" class="title">config/environment.ts</text>
  </g>

  <g id="pwconfig">
    <rect x="340" y="320" width="240" height="50" class="box node-fill-pwconf" />
    <text x="460" y="350" text-anchor="middle" class="title">playwright.config.ts</text>
  </g>

  <g id="browser">
    <rect x="900" y="130" width="220" height="50" class="box" />
    <text x="1010" y="160" text-anchor="middle" class="title">Browser / Playwright run</text>
  </g>

  <g id="reports">
    <rect x="900" y="220" width="220" height="50" class="box node-fill-reports" />
    <text x="1010" y="250" text-anchor="middle" class="title">reports/ (html, trace)</text>
  </g>

  <g id="assertions">
    <rect x="340" y="400" width="220" height="40" class="box" />
    <text x="450" y="425" text-anchor="middle" class="small">assertions (expect(...))</text>
  </g>

  <!-- Arrows -->
  <line x1="280" y1="65" x2="340" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="560" y1="65" x2="620" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="750" y1="100" x2="750" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="730" y1="180" x2="730" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="560" y1="250" x2="620" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="170" y1="95" x2="170" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="450" y1="145" x2="900" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="1010" y1="180" x2="1010" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="450" y1="90" x2="450" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="190" y1="295" x2="190" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="220" y1="345" x2="340" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="460" y1="295" x2="460" y2="320" class="dashed" stroke="#333" stroke-width="1.2" marker-end="url(#dasharrow)" />

  <!-- Labels on arrows -->
  <text x="200" y="55" class="small">imports</text>
  <text x="500" y="55" class="small">creates</text>
  <text x="760" y="115" class="small">uses</text>
  <text x="760" y="200" class="small">reads/writes</text>
  <text x="480" y="240" class="small">calls</text>
  <text x="110" y="180" class="small">reads</text>
  <text x="680" y="135" class="small">navigation →</text>
  <text x="1020" y="200" class="small">reports</text>
  <text x="470" y="220" class="small">asserts</text>
  <text x="120" y="315" class="small">may import</text>
  <text x="300" y="360" class="small">playwright.config sets baseURL</text>
  <text x="480" y="310" class="small">reads env vars (BASE_URL)</text>

  <!-- Footer note -->
  <text x="60" y="740" class="small">Generated diagram: Login/docs/code-flow.svg</text>
</svg>
